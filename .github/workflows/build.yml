name: 构建并发布 NovaForge

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: 生成图标
        run: python tools\gen_icons.py

      - name: 用 PyInstaller 打包单文件 EXE
        run: |
          pyinstaller --noconfirm NovaForge.spec

      - name: 上传构建产物（非 tag 推送时）
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: NovaForge
          path: dist/NovaForge.exe

      - name: 创建/更新 Release（tag 推送时，如 v2.1.0）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/NovaForge.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
